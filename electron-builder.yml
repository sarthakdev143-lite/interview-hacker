appId: com.wingman.desktop
productName: WingMan
asar: true
icon: build/icon.ico

directories:
  output: release

files:
  - dist/**/*
  - package.json

extraResources:
  - from: python/dist/wingman-server
    to: python/wingman-server
    filter:
      - "**/*"

win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: WingMan-${version}-setup.${ext}
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false
  executableName: WingMan

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  perMachine: false
