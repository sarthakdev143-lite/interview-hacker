name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      # build-python.mjs prefers .venv over the system interpreter, so create
      # one here rather than installing PyInstaller globally. This keeps CI
      # doing exactly what a contributor's machine does.
      - name: Create Python venv and install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r python/requirements.txt
          .venv\Scripts\python.exe -m pip install pyinstaller

      # Runs verify -> build -> PyInstaller sidecar -> electron-builder.
      - name: Package
        run: npm run package

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release/*.exe
          if (-not $files) { throw "electron-builder produced no installer" }
          foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)" | Out-File -Append -Encoding ascii release/SHA256SUMS.txt
          }
          Get-Content release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/SHA256SUMS.txt
          body: |
            > Releases are **unsigned**. Windows SmartScreen will warn —
            > choose *More info → Run anyway*, or verify the SHA256 below
            > against `SHA256SUMS.txt` and build from source if you prefer.

            See [SECURITY.md](SECURITY.md) for what this app does with your
            audio, and the disclaimer in the README before using it.
