name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        # pyaudiowpatch is win32-only via an environment marker, so this
        # resolves on all three runners. sounddevice imports behind a
        # try/except, so the tests do not need PortAudio present.
        run: python -m pip install --upgrade pip && pip install -r python/requirements.txt

      # typecheck + lint + python tests. This is the whole gate — there is no
      # JS/TS test runner. run-python-tests.mjs falls back to the interpreter on
      # PATH, which is the one setup-python just provisioned.
      - name: Verify
        run: npm run verify

      - name: Build renderer, main and preload
        run: npm run build

      - name: Assert the packaged renderer carries a CSP
        # The packaged app loads over file://, where the onHeadersReceived
        # policy in main.ts cannot apply. The meta tag injected at build time
        # by vite.renderer.config.ts is the only thing protecting a real
        # install, so fail the build if it ever goes missing.
        shell: bash
        run: |
          if ! grep -q 'http-equiv="Content-Security-Policy"' dist/renderer/index.html; then
            echo "::error::dist/renderer/index.html has no CSP meta tag"
            exit 1
          fi
          if grep -q 'fonts.googleapis.com' dist/renderer/assets/*.css; then
            echo "::error::renderer CSS still references Google Fonts; the CSP will block it"
            exit 1
          fi
          echo "CSP meta tag present; fonts are self-hosted."
